[project]
name = "market-fastapi"
version = "0.1.0"
description = ""
authors = [
    {name = "Misha"}
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi (>=0.125.0,<0.126.0)",
